<style>
  :root { --bg:#08090C; --surface:#101218; --ink:#FFFFFF; --muted:#9298A5; --accent:#4D8DFF; --line:#252832; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  ul { list-style: none; }

  /* ---------- Navbar ---------- */
  header { position: fixed; inset: 0 0 auto 0; z-index: 50; background: rgba(8,9,12,.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(37,40,50,.6); }
  nav { max-width: 1400px; margin: 0 auto; height: 64px; padding: 0 48px; display: flex; align-items: center; justify-content: space-between; }
  .brand { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 500; font-size: 16px; }
  .brand span { color: var(--accent); }
  .links { display: flex; gap: 36px; }
  .links a { position: relative; font-size: 14px; color: var(--muted); padding: 4px 0; transition: color .3s; }
  .links a::after { content: ""; position: absolute; left: 0; bottom: -2px; height: 1px; width: 0; background: var(--line); transition: width .3s; }
  .links a:hover { color: var(--ink); }
  .links a:hover::after { width: 100%; }
  .links a.active { color: var(--ink); }
  .links a.active::after { width: 100%; background: var(--accent); }
  .burger { display: none; background: none; border: 0; color: var(--ink); width: 44px; height: 44px; margin-right: -10px; cursor: pointer; }
  .burger svg { width: 22px; height: 22px; }

  /* ---------- Hero ---------- */
  .hero { position: relative; min-height: 100vh; min-height: 100svh; overflow: hidden; }
  .globe { position: absolute; top: 0; bottom: 0; right: 0; width: 64%; pointer-events: none; animation: fade 1.6s ease-out both; }
  .globe canvas { display: block; }
  .content { position: relative; z-index: 10; max-width: 1400px; margin: 0 auto; min-height: 100vh; min-height: 100svh; padding: 64px 48px 96px; display: flex; flex-direction: column; justify-content: center; }
  .text { max-width: 576px; }
  .eyebrow { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; letter-spacing: .3em; color: var(--accent); }
  h1 { margin-top: 20px; font-size: clamp(48px, 8vw, 96px); line-height: 1.02; font-weight: 600; letter-spacing: -0.03em; overflow-wrap: anywhere; }
  .subtitle { margin-top: 24px; font-size: clamp(20px, 2.4vw, 30px); color: rgba(255,255,255,.9); }
  .desc { margin-top: 20px; max-width: 448px; line-height: 1.65; color: var(--muted); }
  .btn { display: inline-flex; align-items: center; gap: 12px; height: 48px; padding: 0 28px; margin-top: 40px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 500; transition: background .3s, color .3s; }
  .btn:hover { background: var(--accent); color: var(--ink); }
  .btn svg { width: 16px; height: 16px; transition: transform .3s; }
  .btn:hover svg { transform: translateX(4px); }

  .scroll { position: absolute; left: 48px; bottom: 32px; z-index: 10; display: flex; align-items: center; gap: 16px; }
  .scroll .bar { position: relative; width: 1px; height: 40px; background: var(--line); overflow: hidden; }
  .scroll .bar i { position: absolute; left: 0; right: 0; top: 0; height: 50%; background: var(--accent); animation: scrollline 2.2s ease-in-out infinite; }
  .scroll span { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10px; letter-spacing: .3em; color: var(--muted); }

  /* появление */
  .up { animation: up .8s cubic-bezier(.22,1,.36,1) both; }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes scrollline { from { transform: translateY(-100%); } to { transform: translateY(100%); } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; } }

  /* ---------- Mobile ---------- */
  @media (max-width: 767px) {
    nav { padding: 0 24px; }
    .burger { display: flex; align-items: center; justify-content: center; }
    .links { display: none; position: absolute; top: 64px; left: 0; right: 0; flex-direction: column; gap: 0; padding: 12px 24px; background: var(--bg); border-top: 1px solid rgba(37,40,50,.6); border-bottom: 1px solid rgba(37,40,50,.6); }
    .links.open { display: flex; }
    .links a { font-size: 18px; padding: 14px 0; }
    .links a::after { display: none; }
    .globe { left: 0; width: 100%; opacity: .6; }
    .content { justify-content: flex-start; padding: 128px 24px 160px; }
    .scroll { left: 24px; }
  }
</style>

<body>

<main class="hero">

  <div class="content">
    <div class="text">
      <p class="eyebrow up" style="animation-delay:100ms">HELLO, I’M</p>

<script>
/* ---------- Мобильное меню ---------- */
const burger = document.getElementById('burger');
const links = document.getElementById('links');
burger.addEventListener('click', () => {
  const open = links.classList.toggle('open');
  burger.setAttribute('aria-expanded', open);
});

/* ---------- ASCII-Земля ---------- */
// Упрощённые контуры континентов [долгота, широта]
const POLYS = [
  [[-168,66],[-140,70],[-120,72],[-95,72],[-80,68],[-62,60],[-55,50],[-67,44],[-76,36],[-81,25],[-97,26],[-97,18],[-88,16],[-80,8],[-92,14],[-105,20],[-115,30],[-124,40],[-125,49],[-135,58],[-152,60],[-165,60]],
  [[-73,78],[-55,82],[-20,82],[-20,70],[-43,60],[-52,66]],
  [[-80,8],[-62,11],[-50,0],[-35,-6],[-40,-22],[-48,-27],[-58,-38],[-65,-42],[-68,-55],[-75,-50],[-73,-37],[-71,-20],[-76,-14],[-81,-5]],
  [[-10,36],[-9,43],[-4,48],[5,53],[10,58],[5,62],[15,69],[30,71],[60,69],[80,73],[110,77],[140,72],[170,70],[180,66],[165,60],[155,58],[142,52],[135,44],[128,38],[122,40],[122,30],[110,20],[106,10],[100,2],[98,16],[92,22],[80,14],[77,8],[72,20],[66,25],[58,24],[55,17],[44,12],[38,20],[34,28],[35,31],[36,36],[27,37],[24,40],[19,42],[12,44],[8,44],[3,42],[-2,37]],
  [[-17,21],[-10,30],[-6,36],[10,37],[11,33],[20,31],[32,31],[35,28],[43,12],[51,12],[40,-3],[40,-15],[35,-25],[27,-34],[18,-34],[12,-17],[9,-1],[9,4],[-8,4],[-17,14]],
  [[114,-22],[122,-18],[130,-12],[137,-12],[142,-11],[146,-19],[153,-26],[150,-37],[141,-38],[131,-31],[115,-34]],
  [[-5,50],[1,52],[-3,58],[-6,55]],
  [[130,32],[141,40],[142,45],[136,36]],
  [[44,-25],[50,-15],[47,-13],[43,-22]],
  [[95,5],[105,-6],[115,-8],[108,-3]]
];
function inside(lon, lat, p) {
  let c = false;
  for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
    const xi = p[i][0], yi = p[i][1], xj = p[j][0], yj = p[j][1];
    if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}
const MW = 360, MH = 180, mask = new Uint8Array(MW * MH);
for (let y = 0; y < MH; y++) {
  const lat = 90 - (y + 0.5);
  for (let x = 0; x < MW; x++) {
    const lon = -180 + (x + 0.5);
    let land = lat < -70;
    for (let k = 0; !land && k < POLYS.length; k++) land = inside(lon, lat, POLYS[k]);
    mask[y * MW + x] = land ? 1 : 0;
  }
}
function isLand(lat, lon) {
  const l = (((lon + 180) % 360) + 360) % 360;
  const x = Math.min(MW - 1, Math.floor(l));
  const y = Math.min(MH - 1, Math.max(0, Math.floor(90 - lat)));
  return mask[y * MW + x] === 1;
}
function hash(a, b) {
  let x = (Math.imul(a, 374761393) + Math.imul(b, 668265263)) | 0;
  x = Math.imul(x ^ (x >>> 13), 1274126177);
  return (x ^ (x >>> 16)) >>> 0;
}

const FONT = 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
const LEVELS = 8;
const LAND_POOLS = ['.:', '-=+', 'x7v3', 'o8e0', 'A9RB', 'M#W@'];
const OCEAN = ['.', '.', ':', '·'];
const LAND_C = [], OCEAN_C = [], RIM_C = [];
for (let i = 0; i < LEVELS; i++) {
  const v = Math.round(95 + 160 * i / (LEVELS - 1));
  LAND_C.push(`rgb(${v},${v},${v + 4})`);
  OCEAN_C.push(`rgba(146,152,165,${(0.14 + 0.3 * i / (LEVELS - 1)).toFixed(2)})`);
  RIM_C.push(`rgba(77,141,255,${(0.3 + 0.6 * i / (LEVELS - 1)).toFixed(2)})`);
}
const LX = -0.5, LY = 0.45, LZ = 0.74, TILT = 0.38, SPEED = 0.1;

const wrap = document.getElementById('globe');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, R, cx, cy, cw, ch, fs;
const mouse = { tx: 0, ty: 0, x: 0, y: 0 };
const t0 = performance.now();

function layout() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = wrap.clientWidth; H = wrap.clientHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const mobile = innerWidth < 768;
  R = mobile ? W * 0.62 : Math.min(H * 0.47, W * 0.62);
  cx = mobile ? W * 0.68 : W - R * 0.55;   // правая часть уходит за край экрана
  cy = mobile ? H * 0.8 : H * 0.5 + 24;
  fs = Math.max(8, Math.min(13, R / 33));
  ctx.font = fs + 'px ' + FONT;
  cw = ctx.measureText('M').width; ch = fs * 1.05;
}

function draw(now) {
  const t = reduced ? 0 : (now - t0) / 1000;
  mouse.x += (mouse.tx - mouse.x) * 0.05;
  mouse.y += (mouse.ty - mouse.y) * 0.05;
  const tilt = TILT + mouse.y * 0.1, yaw = 2.2 + t * SPEED - mouse.x * 0.25;
  const cosA = Math.cos(tilt), sinA = Math.sin(tilt);
  const ox = cx + mouse.x * 14, oy = cy + mouse.y * 10;
  ctx.clearRect(0, 0, W, H);
  ctx.font = fs + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const rows = Math.ceil(H / ch), cols = Math.ceil(W / cw);
  let cur = '';
  for (let row = 0; row < rows; row++) {
    const py = row * ch + ch / 2, ny = (oy - py) / R;
    if (ny > 1 || ny < -1) continue;
    for (let col = 0; col < cols; col++) {
      const px = col * cw + cw / 2, nx = (px - ox) / R, r2 = nx * nx + ny * ny;
      if (r2 > 1) continue;
      const nz = Math.sqrt(1 - r2);
      const light = nx * LX + ny * LY + nz * LZ;
      const shade = Math.min(1, Math.max(0.06, 0.2 + 0.95 * light));
      const lvl = Math.min(LEVELS - 1, Math.floor(shade * LEVELS));
      const y1 = ny * cosA + nz * sinA, z1 = -ny * sinA + nz * cosA;
      const lat = Math.asin(Math.max(-1, Math.min(1, y1))) * 57.29578;
      const lon = (Math.atan2(nx, z1) - yaw) * 57.29578;
      const h = hash(Math.floor(lon / 2.5), Math.floor(lat / 2.5));
      const rim = r2 > 0.9;
      let c, color;
      if (isLand(lat, lon)) {
        const pool = LAND_POOLS[Math.min(LAND_POOLS.length - 1, Math.floor(shade * LAND_POOLS.length))];
        c = pool[h % pool.length]; color = rim ? RIM_C[lvl] : LAND_C[lvl];
      } else if (h % 13 === 0) {
        c = (h % 2) ? '1' : '0'; color = rim ? RIM_C[lvl] : 'rgba(77,141,255,0.55)';
      } else {
        c = OCEAN[h % OCEAN.length]; color = rim ? RIM_C[lvl] : OCEAN_C[lvl];
      }
      if (color !== cur) { ctx.fillStyle = color; cur = color; }
      ctx.fillText(c, px, py);
    }
  }
}

let last = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (now - last < 33) return;
  last = now; draw(now);
}

layout();
new ResizeObserver(() => { layout(); if (reduced) draw(performance.now()); }).observe(wrap);
if (reduced) draw(performance.now());
else {
  addEventListener('pointermove', e => { mouse.tx = e.clientX / innerWidth - .5; mouse.ty = e.clientY / innerHeight - .5; }, { passive: true });
  requestAnimationFrame(loop);
}
</script>

</body>
